[package]
name = "aegis-provision"
description = "Headless provisioning plans, durable saga, Cloudflare and restricted local deployment adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-config.workspace = true
aegis-contracts.workspace = true
aegis-identity.workspace = true
aegis-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "macros"] }
sha2.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
axum.workspace = true
aegis-node.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync"] }
