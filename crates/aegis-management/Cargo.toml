[package]
name = "aegis-management"
description = "Local management API (OpenAPI /api/v1), auth/RBAC/CSRF, audit and privileged IPC handlers (E-002, E-003)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-contracts = { workspace = true }
aegis-config = { workspace = true }
aegis-core = { workspace = true }
aegis-storage = { workspace = true }
aegis-identity = { workspace = true }
aegis-telemetry = { workspace = true }
aegis-traffic-policy = { workspace = true }
aegis-policy = { workspace = true }
aegis-platform = { workspace = true }
aegis-provision = { workspace = true }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util", "fs"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
