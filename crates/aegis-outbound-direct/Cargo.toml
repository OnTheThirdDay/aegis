version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-contracts = { workspace = true }
aegis-dns = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util"] }
