[package]
name = "aegis-transport-quic"
description = "QUIC transport: the AGP session on one QUIC stream, UDP flows as QUIC datagrams."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-contracts = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros"] }
aegis-identity = { workspace = true }
aegis-contracts = { workspace = true }
