[package]
name = "aegis-identity"
description = "Node identity, local CA, inner mTLS 1.3 configuration and revocation (C-002, E-005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-contracts = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "io-util", "rt", "macros", "net"] }
