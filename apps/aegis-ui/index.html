<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AegisNet Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>AegisNet</div>
    <div id="badges" class="badges" aria-live="polite"></div>
    <div id="who" class="who" hidden></div>
    <button id="logout" class="ghost small" hidden>Sign out</button>
  </header>
  <div class="shell">
    <nav id="nav" class="side" aria-label="Sections" hidden></nav>
    <main id="main" tabindex="-1">
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="view"></section>
    </main>
  </div>
  <footer class="foot muted">
    No telemetry is exported unless an owner explicitly enables it. AegisNet does not claim anonymity or undetectability.
  </footer>
  <script src="/app.js"></script>
</body>
</html>
