[package]
name = "aegis-client"
description = "Portable desktop client: import an invitation, connect, local SOCKS5/HTTP proxy, optional system proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aegis-client"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aegis-config = { workspace = true }
aegis-join = { workspace = true }
aegis-node = { workspace = true }
aegis-telemetry = { workspace = true }
aegis-vpn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
# Native window via OpenGL (glow); x11 is loaded at runtime on Linux.
# Clipboard for the Paste button (same crate eframe's clipboard feature uses).
arboard = { version = "3.7", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "clipboard"] }
