# cargo-deny policy (06 §1, TC-S01). Exceptions must be scoped, owned and
# expiring; record them in docs/DEPENDENCIES.md.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    # Boost: permissive, OSI-approved (Windows clipboard crates of the GUI client).
    "BSL-1.0",
]
confidence-threshold = 0.9
# Fonts embedded in the GUI client only (not in aegisd/aegisctl).
exceptions = [
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

# First-party crates are unpublished (license = "UNLICENSED").
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not registry wildcards.
allow-wildcard-paths = true
deny = [
    # No dynamic plugin loading (02 §3 T0/T1 only). The GUI client's windowing
    # stack loads *system* graphics/display libraries (OpenGL, X11, Wayland)
    # through these wrappers only; aegisd and aegisctl do not link it.
    { name = "libloading", wrappers = ["dlib", "glutin", "x11rb"] },
    # OTLP is hand-encoded; the OTel SDK requires its own review (05 §1).
    { name = "opentelemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
