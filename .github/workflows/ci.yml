# PR / main / nightly gates (06 §2, 07 §11). Reference implementation only:
# protected environments, Pi/CF lab runners and signing are NOT configured
# here and remain BLOCKED until provisioned.
#
# Supply chain: before enabling on a real repository, pin every `uses:` to a
# reviewed full commit SHA (06 §2.2). Tags below are placeholders.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Architecture rules (A-002 / TC-U01)
        run: |
          cargo run --locked -q -p xtask -- arch-check
          cargo run --locked -q -p xtask -- arch-check --self-test

  test-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Property budget on schedule (07 §11 MAIN/NIGHTLY)
        if: github.event_name == 'schedule'
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --locked -p aegis-agp --release

  cross-linux-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - name: Cross build (real Pi 4B tests run only on the protected lab runner)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --target aarch64-unknown-linux-gnu -p aegisd -p aegisctl

  build-probes:
    # Windows/macOS are compile probes only at M1 (no functional claim).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: cargo check --locked --workspace

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-deny --version 0.18.3
      - run: cargo deny --locked check advisories bans licenses sources

  audit:
    # RustSec advisories for direct + transitive deps (TC-S01). Runs on every
    # PR/push and nightly, so advisories published after merge still fail
    # the scheduled run. Unmaintained/yanked warnings are errors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock

  fuzz-smoke:
    # PR: 60 s per parser target (07 §11). Requires nightly + cargo-fuzz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # TODO: pin to reviewed SHA
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz --version 0.12.0
      - name: Fuzz each target
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=1800; fi
          for t in agp_decoder agp_control config_toml http_connect_head destination; do
            cargo +nightly fuzz run "$t" -- -max_total_time=$secs -rss_limit_mb=2048
          done

  required:
    # Aggregate gate: fails if any required child failed, was cancelled or
    # skipped. A missing result is never an implicit pass.
    if: always()
    needs: [lint, test-linux-x86_64, cross-linux-aarch64, build-probes, supply-chain, audit, fuzz-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then exit 1; fi
