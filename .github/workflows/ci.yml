# Branch / nightly gates (06 §2, 07 §11). Branch flow (docs/RELEASING.md):
#   work branches -> staging -> main, by pull request only. Every branch push
#   runs the full gates; pull request events only run branch-policy. main
#   additionally verifies its content already passed through staging.
#
# Reference implementation only:
# protected environments, Pi/CF lab runners and signing are NOT configured
# here and remain BLOCKED until provisioned.
#
# Supply chain: before enabling on a real repository, pin every `uses:` to a
# reviewed full commit SHA (06 §2.2). Tags below are placeholders.
name: ci

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Architecture rules (A-002 / TC-U01)
        run: |
          cargo run --locked -q -p xtask -- arch-check
          cargo run --locked -q -p xtask -- arch-check --self-test

  test-linux-x86_64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Property budget on schedule (07 §11 MAIN/NIGHTLY)
        if: github.event_name == 'schedule'
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --locked -p aegis-agp --release

  cross-linux-aarch64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - name: Cross build (real Pi 4B tests run only on the protected lab runner)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --target aarch64-unknown-linux-gnu -p aegisd -p aegisctl

  build-probes:
    # Windows/macOS compile probes (the client app is built for real by release.yml).
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo check --locked --workspace

  supply-chain:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check advisories bans licenses sources

  audit:
    if: github.event_name != 'pull_request'
    # RustSec advisories for direct + transitive deps (TC-S01). Runs on every
    # PR/push and nightly, so advisories published after merge still fail
    # the scheduled run. Unmaintained/yanked warnings are errors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock

  fuzz-smoke:
    if: github.event_name != 'pull_request'
    # PR: 60 s per parser target (07 §11). Requires nightly + cargo-fuzz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz each target
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=1800; fi
          for t in agp_decoder agp_control config_toml http_connect_head destination; do
            cargo +nightly fuzz run "$t" -- -max_total_time=$secs -rss_limit_mb=2048
          done

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Only staging may be merged into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != staging ]; then
            echo "::error::Pull requests into main must come from staging (got '$HEAD'). Merge into staging first."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"

  main-gate:
    # Rulesets need a paid plan for private repos, so main enforces the flow
    # itself: its file tree must equal a commit that exists on staging.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main only contains staged content
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          if git log origin/staging --format=%T | grep -qx "$tree"; then
            echo "OK: this exact content exists on staging"
          else
            echo "::error::main contains changes that never went through staging. Merge them into staging, then use the release pull request staging -> main."
            exit 1
          fi

  required:
    # Aggregate gate: fails if any required child failed, was cancelled or
    # skipped. A missing result is never an implicit pass.
    if: always() && github.event_name != 'pull_request'
    needs: [lint, test-linux-x86_64, cross-linux-aarch64, build-probes, supply-chain, audit, fuzz-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then exit 1; fi

  # After a release reaches main, move staging up to main so GitHub doesn't
  # report staging as "behind" by the release merge commit. Fast-forward only;
  # staging with new work is left alone. GITHUB_TOKEN pushes trigger nothing.
  sync-staging:
    needs: [required, main-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward staging to main
        run: |
          set -euo pipefail
          if [ "$(git rev-parse origin/staging)" = "$(git rev-parse origin/main)" ]; then
            echo "staging is already at main."
          elif git merge-base --is-ancestor origin/staging origin/main; then
            git push origin "$(git rev-parse origin/main):refs/heads/staging"
            echo "Fast-forwarded staging to $(git rev-parse --short origin/main)."
          else
            echo "staging has commits that aren't on main yet; leaving it as is."
          fi
