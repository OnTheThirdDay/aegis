# Branch / weekly gates (06 §2, 07 §11). Branch flow (docs/RELEASING.md):
#   work branches -> staging -> main, by pull request only.
#
# Sized for the free plan of a private repository (2,000 Linux minutes a
# month; Windows counts 2x, macOS 10x, and every job rounds up to whole
# minutes), so:
#   * one cached Linux job does fmt, clippy, architecture rules, tests and a
#     Windows compile check (mingw), on code pushes to any branch but main
#     (main only ever receives content already tested on staging; its gate
#     runs in release.yml);
#   * documentation-only pushes run nothing;
#   * staging additionally runs the dependency gates (cargo-deny, cargo-audit);
#   * fuzzing and the large property budget run weekly (and on demand);
#   * pull requests only run branch-policy, and only into main;
#   * macOS is built only by release.yml for releases on main.
#
# Reference implementation only: protected environments, Pi/CF lab runners
# and signing are NOT configured here and remain BLOCKED until provisioned.
# Supply chain: pin every `uses:` to a reviewed full commit SHA (06 §2.2).
name: ci

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*", ".gitattributes"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per fuzz target (0 = skip fuzzing)
        default: "180"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Windows cross toolchain
        # A stalled package mirror fails here quickly instead of holding the
        # job until its limit; retried requests usually get through.
        timeout-minutes: 8
        run: |
          apt="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # Rebuilding the man-page index after installing can take many
          # minutes on hosted runners, silently; nothing here needs it.
          sudo rm -f /var/lib/man-db/auto-update
          $apt update -qq
          $apt install -y -qq gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          # Only the long-lived branches write the cache; work branches read it.
          save-if: ${{ github.ref == 'refs/heads/staging' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Architecture rules (A-002 / TC-U01)
        run: |
          cargo run --locked -q -p xtask -- arch-check
          cargo run --locked -q -p xtask -- arch-check --self-test
      - run: cargo test --locked --workspace
      - name: Windows compile check
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CFLAGS_x86_64_pc_windows_gnu: -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00
        run: cargo check --locked --workspace --target x86_64-pc-windows-gnu
      - name: Dependency gates (staging)
        if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tools=$(mktemp -d)
          curl -fsSL -o "$tools/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_DENY_SHA256  $tools/deny.tgz" | sha256sum -c -
          curl -fsSL -o "$tools/audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$CARGO_AUDIT_VERSION/cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION.tgz"
          echo "$CARGO_AUDIT_SHA256  $tools/audit.tgz" | sha256sum -c -
          tar -xzf "$tools/deny.tgz" -C "$tools" --strip-components=1
          tar -xzf "$tools/audit.tgz" -C "$tools" --strip-components=1
          "$tools/cargo-deny" --locked check advisories bans licenses sources
          "$tools/cargo-audit" audit --deny warnings
          "$tools/cargo-audit" audit --deny warnings --file fuzz/Cargo.lock

  weekly:
    # Fuzzing (07 §11) and the large property budget. Weekly, or on demand
    # with workflow_dispatch (fuzz_seconds per target; 0 skips fuzzing).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds != '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Property budget (07 §11 MAIN/NIGHTLY)
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --locked -p aegis-agp --release
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz each target
        env:
          SECS: ${{ inputs.fuzz_seconds || '180' }}
        run: |
          for t in agp_decoder agp_control config_toml http_connect_head destination; do
            cargo +nightly fuzz run "$t" -- -max_total_time="$SECS" -timeout=30 -rss_limit_mb=2048
          done

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only staging may be merged into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != staging ]; then
            echo "::error::Pull requests into main must come from staging (got '$HEAD'). Merge into staging first."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"
