name: Release

# Publishes builds of the branch flow (see docs/RELEASING.md):
#   main (push)        -> when the workspace version has no tag yet: tag vX.Y.Z,
#                         multi-arch image ghcr.io/<owner>/aegis:X.Y.Z + :latest, and a
#                         GitHub Release with the client apps and SHA256SUMS
#   manual run (Actions -> Release -> Run workflow), to test before a release:
#     on staging       -> image ghcr.io/<owner>/aegis:staging (+ :sha-xxxxxxx)
#     on a work branch -> image ghcr.io/<owner>/aegis:test-<branch> (+ :sha-xxxxxxx)
# Merging into staging builds nothing by itself (a full build takes ~30 minutes).
# Versions are bumped by version.yml, never by hand on main.
#
# Also runs the main gate (main only holds content tested on staging) and
# fast-forwards staging after a release, on every push to main.
#
# Cost (private repository, free plan): all builds run on Linux (the Windows
# client cross-compiles with mingw); macOS clients are built only for releases
# on main, in one job; test images only when asked for.
#
# Servers install from the public image alone: it carries install.sh, stamped
# with its own tag (the repository itself may be private).
#
# Supply chain: pin every `uses:` to a reviewed full commit SHA before relying on
# this for production (06 §2.2). The image carries buildx provenance and an SBOM.
# (GitHub artifact attestations are not used: they need a public repository on
# the free plan.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      image: ${{ steps.plan.outputs.image }}
      # Image tag of a test build (staging or test-<branch>).
      tag: ${{ steps.plan.outputs.tag }}
      # The latest cloudflared release, the same for both architectures.
      cloudflared: ${{ steps.plan.outputs.cloudflared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          tag=""
          case "$GITHUB_REF" in
            refs/heads/staging)
              channel=staging; tag=staging ;;
            refs/heads/main)
              # Main gate: main only holds content that was tested on staging.
              # (fetch-depth 0 already brought origin/staging and all tags.)
              if ! git log origin/staging --format=%T | grep -qx "$(git rev-parse 'HEAD^{tree}')"; then
                echo "::error::main contains changes that never went through staging. Merge them into staging, then use the release pull request staging -> main."; exit 1
              fi
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                channel=none; echo "v$version is already released; nothing to publish."
              else
                channel=release
              fi ;;
            refs/heads/*)
              # A test build of a work branch (manual runs only).
              branch=${GITHUB_REF#refs/heads/}
              slug=$(printf '%s' "$branch" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9._-' '-' | cut -c1-100)
              channel=staging; tag="test-$slug" ;;
            *) channel=none ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cloudflared=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          echo "cloudflared=$cloudflared" >> "$GITHUB_OUTPUT"
          echo "Channel: $channel, version $version${tag:+, image tag $tag}, cloudflared $cloudflared"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gateway:
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    runs-on: ubuntu-22.04 # glibc 2.35: runs on Debian 12+ / Ubuntu 22.04+
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cross toolchain
        if: matrix.arch == 'arm64'
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt-install.sh gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gateway-${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p aegisd -p aegisctl
      - name: Stage binaries and the latest cloudflared
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CLOUDFLARED_VERSION: ${{ needs.plan.outputs.cloudflared }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "out/$ARCH"
          cp "target/$TARGET/release/aegisd" "target/$TARGET/release/aegisctl" "out/$ARCH/"
          # Checked against Cloudflare's published SHA-256; also writes cloudflared.json.
          sh deploy/cloudflared-latest.sh "$ARCH" "out/$ARCH"
          chmod 0755 out/"$ARCH"/aegisd out/"$ARCH"/aegisctl
      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ matrix.arch }}
          path: out/
          retention-days: 7

  clients:
    # Linux and Windows clients, both built on Linux (Windows via mingw).
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows cross toolchain
        # A stalled package mirror fails here quickly instead of holding the
        # job until its limit; retried requests usually get through.
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt-install.sh gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Wintun
        # The system VPN's driver (wintun.net, unmodified), embedded in the
        # Windows client, which installs it next to its helper.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wintun.zip" https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  $RUNNER_TEMP/wintun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/wintun.zip" -d "$RUNNER_TEMP"
          echo "AEGIS_WINTUN_DIR=$RUNNER_TEMP/wintun" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: clients
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CFLAGS_x86_64_pc_windows_gnu: -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00
        run: |
          set -euo pipefail
          cargo build --locked --release -p aegis-client
          cargo build --locked --release --target x86_64-pc-windows-gnu -p aegis-client
          mkdir -p out
          cp target/release/aegis-client out/aegis-client-linux-x86_64
          cp target/x86_64-pc-windows-gnu/release/aegis-client.exe out/aegis-client-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux-windows
          path: out/
          retention-days: 7

  clients-macos:
    # macOS runners bill 10x: only for releases, both architectures in one job.
    needs: plan
    if: needs.plan.outputs.channel == 'release'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin -p aegis-client
          cargo build --locked --release --target x86_64-apple-darwin -p aegis-client
          mkdir -p out
          # One universal AegisBorne.app in a disk image.
          bash .github/scripts/macos-dmg.sh "$VERSION" \
            target/aarch64-apple-darwin/release/aegis-client \
            target/x86_64-apple-darwin/release/aegis-client \
            out/aegis-client-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: client-macos
          path: out/
          retention-days: 7

  android:
    # The Android client: the Rust core with the NDK, the app with Flutter.
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
      FLUTTER_VERSION: 3.44.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          # `yes` ends on SIGPIPE when sdkmanager exits; that isn't a failure.
          { yes 2>/dev/null || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Rust core
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ABIS=arm64-v8a \
            bash apps/aegis-mobile/scripts/build-rust-android.sh
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.AEGIS_ANDROID_KEYSTORE_B64 }}
        run: |
          # Updates install only over an APK signed with the same key.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AEGIS_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::AEGIS_ANDROID_KEYSTORE_B64 is not set: this APK is signed with a throwaway key and later builds won't install over it"
          fi
      - name: App
        working-directory: apps/aegis-mobile
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          AEGIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEYSTORE_PASSWORD }}
          AEGIS_ANDROID_KEY_ALIAS: ${{ secrets.AEGIS_ANDROID_KEY_ALIAS }}
          AEGIS_ANDROID_KEY_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter --disable-analytics >/dev/null
          build() {
            flutter build apk --release --flavor "$1" --split-per-abi --target-platform android-arm64 \
              --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          }
          mkdir -p ../../out
          # AegisBorne (borne.aegis.app).
          build borne
          cp build/app/outputs/flutter-apk/app-arm64-v8a-borne-release.apk ../../out/aegis-client-android-arm64.apk
          # The last update of the old app ID (AegisNet, net.aegis.app): it
          # carries AegisBorne, installs it and hands the servers over
          # (Migration.kt). It installs over AegisBorne only with the same key.
          if [ -n "${AEGIS_ANDROID_KEYSTORE:-}" ]; then
            mkdir -p android/app/src/legacy/assets
            cp ../../out/aegis-client-android-arm64.apk android/app/src/legacy/assets/aegisborne.apk
            build legacy
            cp build/app/outputs/flutter-apk/app-arm64-v8a-legacy-release.apk ../../out/aegisnet-update-android-arm64.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: client-android
          path: out/
          retention-days: 7

  ios:
    # The iOS app as an Ad Hoc build for the iPhones registered on the
    # account (ADR-0018). Skipped until the Apple secrets are set
    # (RELEASING.md); then every build includes every registered iPhone.
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    # Optional for a release: a failure here (no iPhone registered yet, an
    # expired certificate) is reported but doesn't hold the others back.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.44.4
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_DIST_P12_B64: ${{ secrets.APPLE_DIST_P12_B64 }}
      APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
    steps:
      - name: Apple secrets
        id: apple
        run: |
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_DIST_P12_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Apple secrets are not set: no iOS build (RELEASING.md)"
          fi
      - uses: actions/checkout@v7
        if: steps.apple.outputs.ready
        with:
          persist-credentials: false
      - name: Toolchains
        if: steps.apple.outputs.ready
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q cryptography
      - uses: Swatinem/rust-cache@v2
        if: steps.apple.outputs.ready
        with:
          key: ios
      - name: Rust core
        if: steps.apple.outputs.ready
        run: TARGETS=aarch64-apple-ios bash apps/aegis-mobile/scripts/build-rust-ios.sh
      - name: Signing
        if: steps.apple.outputs.ready
        run: |
          set -euo pipefail
          # The distribution certificate in a keychain of its own.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$APPLE_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Fresh Ad Hoc profiles with every registered iPhone.
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios-profiles.py install
      - name: App
        if: steps.apple.outputs.ready
        working-directory: apps/aegis-mobile
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          flutter --disable-analytics >/dev/null
          flutter build ipa --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist
          mkdir -p ../../out
          cp build/ios/ipa/*.ipa ../../out/aegis-client-ios.ipa
      - name: Remove the keychain
        if: always() && steps.apple.outputs.ready
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v7
        if: steps.apple.outputs.ready
        with:
          name: client-ios
          path: out/
          retention-days: 7

  image:
    needs: [plan, gateway, clients, clients-macos, android, ios]
    # clients-macos is skipped for staging; any failure still stops here.
    if: needs.plan.outputs.channel != 'none' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: gateway-*
          path: context/bin
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: context/clients
          merge-multiple: true
      - name: Prepare build context
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
          AEGIS_UPDATE_SIGNING_KEY: ${{ secrets.AEGIS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cp deploy/Dockerfile.prebuilt context/Dockerfile
          chmod 0755 context/bin/*/* context/clients/*
          # Releases sign their client builds as app updates, which the
          # gateway offers its devices (ADR-0017). Staging builds reuse the
          # release's version number, so they are never offered.
          if [ "$CHANNEL" = release ]; then
            if [ -n "$AEGIS_UPDATE_SIGNING_KEY" ]; then
              bash .github/scripts/sign-updates.sh context/clients "$VERSION"
            else
              echo "::warning::AEGIS_UPDATE_SIGNING_KEY is not set: this release's apps won't be offered as updates"
            fi
          fi
          # The image's installer installs this image's tag by default.
          if [ "$CHANNEL" = release ]; then tag=$VERSION; else tag=$TAG; fi
          sed -e "s|^RELEASE_IMAGE=\"@IMAGE@\"|RELEASE_IMAGE=\"$IMAGE:$tag\"|" \
            deploy/install.sh > context/install.sh
          grep -q "^RELEASE_IMAGE=\"$IMAGE:$tag\"" context/install.sh
          find context -type f | sort
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          short=${GITHUB_SHA::7}
          if [ "$CHANNEL" = release ]; then
            tags="$IMAGE:$VERSION,$IMAGE:latest,$IMAGE:sha-$short"
          else
            tags="$IMAGE:$TAG,$IMAGE:sha-$short"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

  release:
    needs: [plan, gateway, clients, clients-macos, android, ios, image]
    if: needs.plan.outputs.channel == 'release' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          chmod 0755 assets/*
          ( cd assets && sha256sum * > SHA256SUMS )
          cat assets/SHA256SUMS
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          ## Install or upgrade the gateway

          \`\`\`sh
          docker run --rm --pull always --entrypoint cat $IMAGE:$VERSION /usr/share/aegisnet/install.sh > install.sh
          sudo sh install.sh                 # add --tunnel-only on a public server
          \`\`\`

          Image: \`$IMAGE:$VERSION\` (\`$IMAGE@$DIGEST\`), linux/amd64 and linux/arm64.
          Clients: download below or from the gateway's web console (Devices > Client apps).
          Verify files with \`SHA256SUMS\`.
          NOTES
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md --generate-notes

  # After a release reaches main, move staging up to main so GitHub doesn't
  # report staging as "behind" by the release merge commit. Fast-forward only;
  # staging with new work is left alone. GITHUB_TOKEN pushes trigger nothing.
  sync-staging:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward staging to main
        run: |
          set -euo pipefail
          if [ "$(git rev-parse origin/staging)" = "$(git rev-parse origin/main)" ]; then
            echo "staging is already at main."
          elif git merge-base --is-ancestor origin/staging origin/main; then
            git push origin "$(git rev-parse origin/main):refs/heads/staging"
            echo "Fast-forwarded staging to $(git rev-parse --short origin/main)."
          else
            echo "staging has commits that aren't on main yet; leaving it as is."
          fi
