name: Pull requests

# Opens the pull requests of the branch flow automatically (see docs/RELEASING.md):
#   work branch pushed     -> pull request into staging
#   staging CI succeeded   -> release pull request staging -> main (kept up to date)
#
# Token: the PR_TOKEN secret (fine-grained personal access token for this repo with
# "Pull requests: Read and write" and "Contents: Read and write"). Pull requests opened
# with it run their checks straight away. Without PR_TOKEN the built-in GITHUB_TOKEN is
# used, which needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests", and GitHub then asks for approval before checks run.

on:
  push:
    branches-ignore: [main, staging]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  into-staging:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request into staging
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open."; exit 0
          fi
          if [ "$(gh api "repos/$GH_REPO/compare/staging...$BRANCH" --jq .ahead_by)" = 0 ]; then
            echo "$BRANCH has no commits that staging doesn't have."; exit 0
          fi
          title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          gh pr create --base staging --head "$BRANCH" --title "${title:-$BRANCH}" \
            --body "Merging this publishes \`ghcr.io/${GH_REPO,,}:staging\` for testing. A release pull request into \`main\` is then opened automatically."

  release:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the release pull request staging -> main
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          compare="repos/$GH_REPO/compare/main...staging"
          if [ "$(gh api "$compare" --jq .ahead_by)" = 0 ]; then
            echo "staging has nothing that isn't already on main."; exit 0
          fi
          version=$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=staging" --jq .content | base64 -d \
            | sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p')
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            note="The version is still **$version** (already released), so merging updates \`main\` without publishing a release. Run **Version bump** to publish one."
          else
            note="Merging publishes release **v$version**: tag, image \`ghcr.io/${GH_REPO,,}:$version\` and a GitHub Release."
          fi
          body=$(
            echo "Changes on \`staging\` that aren't on \`main\` yet. Test them with \`ghcr.io/${GH_REPO,,}:staging\` first."
            echo
            echo "$note"
            echo
            gh api "$compare" --jq '.commits[] | select(.parents | length == 1) | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            echo
            echo "Merge with **Create a merge commit** (not squash or rebase)."
          )
          number=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
            echo "Updated release pull request #$number"
          else
            gh pr create --base main --head staging --title "Release to main" --body "$body"
          fi
